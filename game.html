<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Жабы - Игра</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Start Screen -->
    <div id="start-screen" class="start-screen">
      <div class="start-content">
        <h1 class="start-title">Жабы</h1>
        <p class="start-description">
          Переместите всех красных жаб направо, а синих - налево!
        </p>
        <p class="start-rules">
          Правила: Жаба может прыгнуть на соседний камень или перепрыгнуть через
          одну жабу.
        </p>
        <button id="start-btn" class="start-button">НАЧАТЬ ИГРУ</button>
      </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="win-screen hidden">
      <div class="win-content">
        <h2 class="win-title">Поздравляем!</h2>
        <div class="win-stats">
          <p class="win-stat">
            Ходов: <span id="win-moves" class="win-value">0</span>
          </p>
          <p class="win-stat">
            Времени: <span id="win-time" class="win-value">0:00</span>
          </p>
        </div>
        <div class="win-buttons">
          <button id="win-restart-btn" class="win-button primary">
            ИГРАТЬ СНОВА
          </button>
          <button id="win-menu-btn" class="win-button secondary">
            В ГЛАВНОЕ МЕНЮ
          </button>
        </div>
      </div>
    </div>

    <!-- Main Game Container -->
    <div id="game-container" class="game-container">
      <h1 class="game-title">Жабы (Игра)</h1>

      <!-- Stats -->
      <div class="stats">
        <div class="stat-item">Ходов: <span id="moves-counter">0</span></div>
        <div class="stat-item">Время: <span id="timer">0:00</span></div>
      </div>

      <!-- Game Board -->
      <div class="game-board">
        <div class="board-background-wrapper">
          <div class="board-overlay"></div>
          <img
            src="./public/boloto.jpg"
            alt="Swamp background"
            class="board-background"
          />
        </div>
        <div id="stones-container" class="stones-container">
          <!-- Stones will be generated by JS -->
        </div>
        <div class="control-buttons">
          <button id="restart-btn" class="control-btn restart">
            НАЧАТЬ ЗАНОВО
          </button>
          <button id="menu-btn" class="control-btn menu">В ГЛАВНОЕ МЕНЮ</button>
        </div>
      </div>

      <!-- High Scores -->
      <div class="high-scores">
        <h2 class="scores-title">Топ 10 игроков</h2>
        <div id="scores-list" class="scores-list">
          <p class="no-scores">Пока нет рекордов</p>
        </div>
      </div>
    </div>

    <audio
      id="croak-sound"
      src="./public/single_frog_croak.mp3"
      preload="auto"
    ></audio>
    <script src="game.js"></script>
  </body>
</html>
